name: Release

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: check-my-server-x86_64-linux
          - target: aarch64-unknown-linux-musl
            artifact: check-my-server-aarch64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cross --git https://github.com/cross-rs/cross
      - run: cross build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/check-my-server ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate checksums
        run: |
          sha256sum \
            check-my-server-x86_64-linux/check-my-server-x86_64-linux \
            check-my-server-aarch64-linux/check-my-server-aarch64-linux \
            | sed 's|  .*/|  |' > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            check-my-server-x86_64-linux/check-my-server-x86_64-linux
            check-my-server-aarch64-linux/check-my-server-aarch64-linux
            checksums.txt
